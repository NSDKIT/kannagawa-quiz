<head>

<title>神流川発電所 1000問クイズゲーム</title>
<style>

.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font-size:.84rem;color:#c9d8e7;border:1px solid var(--line);background:#0b1928;border-radius:999px;padding:7px 10px}.chip strong{color:#fff}.progress{height:9px;background:#081522;border:1px solid #1f344a;border-radius:999px;overflow:hidden;margin:10px 0 18px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s ease}.qcard{padding:clamp(18px,4vw,30px)}.qmeta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:.85rem;margin-bottom:15px}.question{font-size:clamp(1.2rem,3vw,1.7rem);line-height:1.65;font-weight:850;letter-spacing:.01em;margin:0 0 18px}.ox{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}.ox .btn{font-size:2rem;min-height:86px}.feedback{border-radius:14px;padding:15px;margin-top:16px;line-height:1.7;border:1px solid var(--line);background:#0a1827}.feedback.correct{border-color:#2f8062;background:#0f2c25}.feedback.wrong{border-color:#914551;background:#321a20}.answerBox{margin-top:16px;border-left:4px solid var(--accent);padding:14px 16px;background:#0b1a2a;border-radius:0 12px 12px 0}.answerBox .label{color:var(--accent);font-weight:900;margin-bottom:6px}.selfgrade{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat{border:1px solid var(--line);background:#0b1928;border-radius:14px;padding:14px;text-align:center}.stat .n{font-size:1.55rem;font-weight:950}.stat .k{font-size:.8rem;color:var(--muted)}.resultTitle{font-size:2rem;margin:0 0 6px}.mistakes{display:grid;gap:10px;margin-top:15px}.mistake{border:1px solid var(--line);background:#0a1827;border-radius:13px;padding:12px}.mistake b{color:var(--accent)}.small{font-size:.86rem;color:var(--muted);line-height:1.6}.footer{text-align:center;color:#7890a8;font-size:.8rem;margin-top:24px}.kbd{display:inline-block;border:1px solid #49617a;border-bottom-width:2px;border-radius:6px;padding:1px 6px;font-size:.75rem;color:#cfe0f0}
@media(max-width:650px){.grid,.statgrid{grid-template-columns:1fr 1fr}.selfgrade{grid-template-columns:1fr}.wrap{width:min(100% - 18px,980px);padding-top:16px}.panel{padding:15px}.ox .btn{min-height:72px}}@media(max-width:390px){.grid,.statgrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
  <div class="eyebrow">⚡ KANNAGAWA POWER STATION</div>
  <h1>神流川発電所<br>1000問クイズゲーム</h1>
  <p class="lead">全20章・1000問。○×は自動採点、短答・計算・記述は模範解答を見て自己採点できます。</p>
</section>

<section id="setup" class="panel">
  <div class="grid">
    <div class="field"><label for="mode">モード</label><select id="mode"><option value="all">全問題</option><option value="ox">○×スピード</option><option value="review">苦手復習</option></select></div>
    <div class="field"><label for="chapter">出題範囲</label><select id="chapter"><option value="all">全20章</option><option value="1">第1章　基礎概要・主要諸元</option>
<option value="2">第2章　地理・水系・ダムの位置関係</option>
<option value="3">第3章　揚水発電の原理と神流川発電所</option>
<option value="4">第4章　南相木ダム（上部ダム）</option>
<option value="5">第5章　上野ダム（下部ダム）</option>
<option value="6">第6章　水路・水圧管路・ TBM ・ HT100</option>
<option value="7">第7章　地下発電所・土木構造</option>
<option value="8">第8章　ポンプ水車・スプリッタランナ</option>
<option value="9">第9章　発電電動機・電気設備</option>
<option value="10">第10章　運転・起動停止・制御</option>
<option value="11">第11章　電力系統・需給調整・再エネ連系</option>
<option value="12">第12章　効率・損失・エネルギー収支</option>
<option value="13">第13章　計算問題 I ：基礎計算</option>
<option value="14">第14章　計算問題 II ：応用計算・運用計画</option>
<option value="15">第15章　保護・監視・制御システム</option>
<option value="16">第16章　保守・点検・状態診断</option>
<option value="17">第17章　安全・防災・環境</option>
<option value="18">第18章　建設史・技術革新</option>
<option value="19">第19章　比較・トラブルシューティング</option>
<option value="20">第20章　ケーススタディ・記述式総合問題</option></select></div>
    <div class="field"><label for="count">問題数</label><select id="count"><option>10</option><option selected>20</option><option>50</option><option>100</option><option value="all">全部</option></select></div>
    <div class="field"><label for="difficulty">難易度</label><select id="difficulty"><option value="all">すべて</option><option value="★">★</option><option value="★★">★★</option><option value="★★★">★★★</option><option value="★★★★">★★★★</option></select></div>
  </div>
  <label class="check"><input id="shuffle" type="checkbox" checked> ランダム順で出題する</label>
  <p id="availability" class="small"></p>
  <div class="actions"><button id="start" class="btn primary" type="button">ゲーム開始</button><button id="clearReview" class="btn" type="button">苦手リストを消去</button></div>
</section>

<section id="game" class="hidden">
  <div class="topbar">
    <div class="chips"><span class="chip">SCORE <strong id="score">0</strong></span><span class="chip">STREAK <strong id="streak">0</strong></span><span class="chip">正解率 <strong id="accuracy">—</strong></span></div>
    <button id="quit" class="btn" type="button">終了</button>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <article class="panel qcard">
    <div id="qmeta" class="qmeta"></div>
    <p id="question" class="question"></p>
    <div id="oxArea" class="ox hidden"><button class="btn" data-ox="○" type="button">○</button><button class="btn" data-ox="×" type="button">×</button></div>
    <div id="freeArea" class="hidden"><label for="userAnswer">あなたの答え <span class="small">（任意・自己採点用）</span></label><textarea id="userAnswer" placeholder="ここに考えた答えを入力してから、模範解答を表示"></textarea><div class="actions"><button id="showAnswer" class="btn primary" type="button">模範解答を見る</button></div></div>
    <div id="feedback" class="feedback hidden" aria-live="polite"></div>
    <div id="answerBox" class="answerBox hidden"><div class="label">模範解答・要点</div><div id="answerText"></div><div id="yourText" class="small" style="margin-top:8px"></div></div>
    <div id="selfgrade" class="selfgrade hidden"><button class="btn good" data-grade="correct" type="button">できた ○</button><button class="btn warn" data-grade="close" type="button">惜しい △</button><button class="btn bad" data-grade="wrong" type="button">わからない ×</button></div>
    <div class="actions"><button id="pass" class="btn" type="button">パス</button><button id="next" class="btn primary hidden" type="button">次の問題 →</button></div>
    <p class="small">○×問題: <span class="kbd">O</span> / <span class="kbd">X</span>　次へ: <span class="kbd">Enter</span></p>
  </article>
</section>

<section id="result" class="panel hidden">
  <h2 class="resultTitle">RESULT</h2><p id="resultMsg" class="lead"></p>
  <div class="statgrid"><div class="stat"><div id="rScore" class="n">0</div><div class="k">SCORE</div></div><div class="stat"><div id="rCorrect" class="n">0</div><div class="k">正解</div></div><div class="stat"><div id="rAccuracy" class="n">0%</div><div class="k">正解率</div></div><div class="stat"><div id="rStreak" class="n">0</div><div class="k">最大連続正解</div></div></div>
  <div class="actions"><button id="again" class="btn primary" type="button">もう一度</button><button id="reviewNow" class="btn" type="button">今回の苦手だけ復習</button></div>
  <div id="mistakes" class="mistakes"></div>
</section>
<div class="footer">学習用クイズです。実際の運転・保安・保守は最新の規程・手順を優先してください。</div>
</main>
<script>

const $=id=>document.getElementById(id);
const state={pool:[],index:0,score:0,correct:0,answered:0,streak:0,maxStreak:0,currentDone:false,sessionWeak:[]};
const REVIEW_KEY='kannagawa_quiz_review_v1';
function loadReview(){try{return JSON.parse(localStorage.getItem(REVIEW_KEY)||'[]').filter(Number.isInteger)}catch(e){return []}}
function saveReview(ids){try{localStorage.setItem(REVIEW_KEY,JSON.stringify([...new Set(ids)]))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selectedPool(){
 let pool=QUESTIONS.slice(); const mode=$('mode').value, ch=$('chapter').value, d=$('difficulty').value;
 if(mode==='ox') pool=pool.filter(q=>q.type==='○×');
 if(mode==='review'){const ids=new Set(loadReview());pool=pool.filter(q=>ids.has(q.id));}
 if(ch!=='all') pool=pool.filter(q=>q.chapter===Number(ch));
 if(d!=='all') pool=pool.filter(q=>q.difficulty===d);
 return pool;
}
function updateAvailability(){const n=selectedPool().length; const review=loadReview().length; $('availability').textContent=`条件に一致: ${n}問 ／ 苦手リスト: ${review}問`; $('start').disabled=n===0;}
['mode','chapter','difficulty'].forEach(id=>$(id).addEventListener('change',updateAvailability));
$('clearReview').addEventListener('click',()=>{saveReview([]);updateAvailability();alert('苦手リストを消去しました。')});
function startGame(customPool=null){
 let pool=customPool?customPool.slice():selectedPool(); if(!pool.length) return;
 if($('shuffle').checked) shuffle(pool); const c=$('count').value; if(c!=='all') pool=pool.slice(0,Math.min(Number(c),pool.length));
 Object.assign(state,{pool,index:0,score:0,correct:0,answered:0,streak:0,maxStreak:0,currentDone:false,sessionWeak:[]});
 $('setup').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');renderQuestion();
}
$('start').addEventListener('click',()=>startGame());
function current(){return state.pool[state.index]}
function updateStats(){$('score').textContent=state.score;$('streak').textContent=state.streak;$('accuracy').textContent=state.answered?Math.round(state.correct/state.answered*100)+'%':'—';$('bar').style.width=((state.index)/state.pool.length*100)+'%'}
function renderQuestion(){
 state.currentDone=false; const q=current(); $('feedback').className='feedback hidden';$('feedback').textContent='';$('answerBox').classList.add('hidden');$('selfgrade').classList.add('hidden');$('next').classList.add('hidden');$('pass').classList.remove('hidden');$('userAnswer').value='';
 $('qmeta').innerHTML=`<span>Q${String(q.id).padStart(4,'0')}</span><span>第${q.chapter}章 ${esc(q.chapterTitle)}</span><span>${esc(q.type)}</span><span>${esc(q.difficulty)}</span><span>${state.index+1} / ${state.pool.length}</span>`;
 $('question').textContent=q.question; const isOx=q.type==='○×' && q.ox;
 $('oxArea').classList.toggle('hidden',!isOx);$('freeArea').classList.toggle('hidden',!!isOx); updateStats();
}
function rememberWeak(id,weak){let ids=loadReview(); if(weak){if(!ids.includes(id)) ids.push(id)}else ids=ids.filter(x=>x!==id); saveReview(ids); updateAvailability();}
function finishAnswer(grade){
 if(state.currentDone)return; state.currentDone=true; const q=current(); state.answered++;
 let points=0, good=false;
 if(grade==='correct'){good=true;state.correct++;state.streak++;points=10+Math.min(state.streak-1,5)*2;rememberWeak(q.id,false)}
 else if(grade==='close'){state.streak=0;points=5;state.sessionWeak.push(q.id);rememberWeak(q.id,true)}
 else{state.streak=0;state.sessionWeak.push(q.id);rememberWeak(q.id,true)}
 state.maxStreak=Math.max(state.maxStreak,state.streak);state.score+=points;
 $('next').classList.remove('hidden');$('pass').classList.add('hidden'); updateStats();
}
$('oxArea').addEventListener('click',e=>{const b=e.target.closest('button[data-ox]');if(!b||state.currentDone)return;const q=current();const pick=b.dataset.ox;const ok=pick===q.ox;$('answerText').textContent=q.answer;$('answerBox').classList.remove('hidden');$('feedback').classList.remove('hidden');$('feedback').classList.add(ok?'correct':'wrong');$('feedback').textContent=ok?'正解！':'不正解。正解は '+q.ox+'。';finishAnswer(ok?'correct':'wrong');});
$('showAnswer').addEventListener('click',()=>{if(state.currentDone)return;const q=current();$('answerText').textContent=q.answer;const u=$('userAnswer').value.trim();$('yourText').textContent=u?'あなたの回答: '+u:'';$('answerBox').classList.remove('hidden');$('selfgrade').classList.remove('hidden');$('showAnswer').disabled=true;});
$('selfgrade').addEventListener('click',e=>{const b=e.target.closest('button[data-grade]');if(!b||state.currentDone)return;const g=b.dataset.grade;$('feedback').classList.remove('hidden');$('feedback').classList.add(g==='correct'?'correct':'wrong');$('feedback').textContent=g==='correct'?'自己採点: 正解！':g==='close'?'自己採点: 惜しい。苦手リストに追加しました。':'自己採点: 要復習。苦手リストに追加しました。';finishAnswer(g);});
$('pass').addEventListener('click',()=>{if(state.currentDone)return;const q=current();$('answerText').textContent=q.answer;$('answerBox').classList.remove('hidden');$('feedback').classList.remove('hidden');$('feedback').classList.add('wrong');$('feedback').textContent='パス。苦手リストに追加しました。';finishAnswer('wrong');});
function goNext(){if(!state.currentDone)return; state.index++; $('showAnswer').disabled=false; if(state.index>=state.pool.length)finishGame(); else renderQuestion();}
$('next').addEventListener('click',goNext);
function finishGame(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const acc=state.answered?Math.round(state.correct/state.answered*100):0;$('rScore').textContent=state.score;$('rCorrect').textContent=state.correct+'/'+state.answered;$('rAccuracy').textContent=acc+'%';$('rStreak').textContent=state.maxStreak;$('resultMsg').textContent=acc>=90?'かなり仕上がっています。次は難易度を上げて挑戦。':acc>=70?'いいペースです。苦手だけ復習すると効率的。':'苦手リストから反復すると伸びやすいです。';const ids=[...new Set(state.sessionWeak)];$('reviewNow').disabled=ids.length===0;$('mistakes').innerHTML=ids.slice(0,20).map(id=>{const q=QUESTIONS[id-1];return `<div class="mistake"><b>Q${String(id).padStart(4,'0')}</b> ${esc(q.question)}<div class="small">答え: ${esc(q.answer)}</div></div>`}).join('')+(ids.length>20?`<p class="small">ほか ${ids.length-20} 問</p>`:'');window.scrollTo({top:0,behavior:'smooth'})}
$('again').addEventListener('click',()=>{$('result').classList.add('hidden');$('setup').classList.remove('hidden');updateAvailability();window.scrollTo({top:0,behavior:'smooth'})});
$('reviewNow').addEventListener('click',()=>{const ids=new Set(state.sessionWeak);const p=QUESTIONS.filter(q=>ids.has(q.id));startGame(p)});
$('quit').addEventListener('click',()=>{if(confirm('現在のゲームを終了しますか？'))finishGame()});
document.addEventListener('keydown',e=>{if($('game').classList.contains('hidden'))return;const tag=(document.activeElement&&document.activeElement.tagName)||'';if(['TEXTAREA','INPUT','SELECT'].includes(tag))return; if(!state.currentDone&&current().type==='○×'){if(e.key.toLowerCase()==='o')document.querySelector('[data-ox="○"]').click();if(e.key.toLowerCase()==='x')document.querySelector('[data-ox="×"]').click();}else if(state.currentDone&&e.key==='Enter')goNext();});
updateAvailability();
</script>
